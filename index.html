async function tryKey(pw){
  for(const b of B){
    try{
      const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(b.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(b.i)},key,d(b.c));
      return new TextDecoder().decode(pt);
    }catch(e){}
  }
  return null;
}
